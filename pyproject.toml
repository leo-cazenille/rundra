[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "shoal-run"
version = "0.1.0.dev0"
description = "Portable experiment execution for scientific computing"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = []

[project.scripts]
shoal-run = "shoal_run.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/shoal_run"]

[dependency-groups]
dev = [
  "mypy>=1.14",
  "pytest>=8.3",
  "ruff>=0.9",
]

[tool.pytest.ini_options]
addopts = ["--strict-markers", "-ra"]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E4", "E7", "E9", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
