[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rundra"
version = "0.1.0.dev0"
description = "Portable experiment execution for scientific computing"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pyyaml>=6.0.2,<7",
]

[project.scripts]
rundr = "rundra.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/rundra"]

[dependency-groups]
dev = [
  "mypy>=1.14",
  "pytest>=8.3",
  "ruff>=0.9",
  "types-pyyaml>=6.0.12",
]

[tool.pytest.ini_options]
addopts = ["--strict-markers", "-ra"]
testpaths = ["tests"]
markers = [
  "shoal_system: opt-in tests that may access the real Shoal cluster",
  "shoal_cpu: resource-consuming Shoal tests requiring a separate CPU opt-in",
  "shoal_gpu: resource-consuming Shoal tests requiring a separate GPU opt-in",
  "shoal_failure: bounded Shoal M4.5 tests requiring a separate failure opt-in",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E4", "E7", "E9", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
