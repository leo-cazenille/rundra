name: Docker Slurm cgroup system

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-slurm-cgroup-system
  cancel-in-progress: false

jobs:
  cgroup-memory-enforcement:
    name: Rundra Slurm cgroup memory enforcement
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RUNDRA_DOCKER_SLURM_IMAGE: rundra-slurm-system:cgroup-ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Enable user namespaces for nested Apptainer
        run: |
          if [[ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Synchronize the Python environment
        run: uv sync --frozen

      - name: Require a rootful cgroup-v2 Docker host
        run: |
          set -euo pipefail
          if docker info --format '{{json .SecurityOptions}}' | grep -q 'rootless'; then
            echo 'The privileged cgroup test requires a rootful Docker daemon.' >&2
            exit 1
          fi
          test "$(docker info --format '{{.CgroupVersion}}')" = 2

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build the shared Docker Slurm image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: tests/system/docker_slurm
          file: tests/system/docker_slurm/Dockerfile
          load: true
          tags: rundra-slurm-system:cgroup-ci
          cache-from: type=gha,scope=docker-slurm-cgroup-system
          cache-to: type=gha,mode=max,scope=docker-slurm-cgroup-system

      - name: Run Rundra through Slurm cgroup memory enforcement
        run: tools/run_docker_slurm_cgroup_tests.sh
        env:
          RUNDRA_DOCKER_SLURM_CGROUP_DIAGNOSTICS: ${{ runner.temp }}/rundra-slurm-cgroup-diagnostics

      - name: Upload cgroup diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docker-slurm-cgroup-diagnostics-${{ github.run_id }}
          path: ${{ runner.temp }}/rundra-slurm-cgroup-diagnostics
          if-no-files-found: warn
          retention-days: 14
