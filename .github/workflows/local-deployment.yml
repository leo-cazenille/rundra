name: local-deployment

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: local-deployment-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  installed-wheel:
    name: installed wheel and 40-worker run
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - name: Synchronize the test environment
        run: uv sync --locked
      - name: Build and install the wheel
        run: |
          uv build --wheel --out-dir dist
          deployment="$RUNNER_TEMP/rundra-local-deployment"
          uv venv --python 3.12 "$deployment"
          uv pip install --python "$deployment/bin/python" dist/*.whl
          "$deployment/bin/rundr" --version
          echo "RUNDRA_LOCAL_DEPLOYMENT_EXECUTABLE=$deployment/bin/rundr" >> "$GITHUB_ENV"
      - name: Run the installed local deployment tests
        run: >-
          uv run pytest
          tests/integration/test_local_worker_pool.py
          tests/integration/test_launch_defaults.py
