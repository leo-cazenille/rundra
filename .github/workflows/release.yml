name: release

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          enable-cache: true
      - name: Verify release identity
        run: |
          version=$(uv run --no-sync python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          if test "${GITHUB_EVENT_NAME}" = "release"; then
            test "${GITHUB_REF_NAME}" = "v${version}"
          fi
      - name: Synchronize locked environment
        run: uv sync --locked
      - name: Validate source
        run: |
          tools/check.sh
          uv run bandit -q -ll -r src
          uv export --frozen --all-extras --no-dev --no-emit-project --format requirements-txt --output-file /tmp/rundra-requirements.txt
          uv run pip-audit --requirement /tmp/rundra-requirements.txt
      - name: Build reproducible artifacts
        run: |
          uv build --out-dir dist-first
          uv build --out-dir dist-second
          (cd dist-first && sha256sum *.whl *.tar.gz | sort) > /tmp/first.sha256
          (cd dist-second && sha256sum *.whl *.tar.gz | sort) > /tmp/second.sha256
          diff -u /tmp/first.sha256 /tmp/second.sha256
      - name: Audit publication boundary and smoke-test wheel
        run: tools/check_distribution.sh dist-first/*.whl dist-first/*.tar.gz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: distributions
          path: |
            dist-first/*.whl
            dist-first/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  testpypi:
    needs: build
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  pypi:
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
