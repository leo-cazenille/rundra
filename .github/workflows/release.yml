name: release

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - name: Verify release identity
        run: |
          version=$(uv run --no-sync python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          if ! [[ "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release version must be stable X.Y.Z, got: ${version}" >&2
            exit 1
          fi
          if test "${GITHUB_EVENT_NAME}" = "release"; then
            if test "${GITHUB_REF_TYPE}" != "tag" || test "${GITHUB_REF_NAME}" != "v${version}"; then
              echo "Production release must run from matching tag v${version}" >&2
              exit 1
            fi
          fi
      - name: Synchronize locked environment
        run: uv sync --locked
      - name: Validate source
        run: |
          tools/check.sh
          uv run bandit -q -ll -r src
          uv export --frozen --all-extras --no-dev --no-emit-project --format requirements-txt --output-file /tmp/rundra-requirements.txt
          uv run pip-audit --requirement /tmp/rundra-requirements.txt
      - name: Build reproducible artifacts
        run: |
          uv build --out-dir dist-first
          uv build --out-dir dist-second
          (cd dist-first && sha256sum -- ./*.whl ./*.tar.gz | sort) > /tmp/first.sha256
          (cd dist-second && sha256sum -- ./*.whl ./*.tar.gz | sort) > /tmp/second.sha256
          diff -u /tmp/first.sha256 /tmp/second.sha256
      - name: Audit publication boundary and smoke-test wheel
        run: tools/check_distribution.sh dist-first/*.whl dist-first/*.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: distributions
          path: |
            dist-first/*.whl
            dist-first/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  testpypi:
    needs: build
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  pypi:
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
