name: docker-slurm-system

on:
  workflow_dispatch:
  schedule:
    - cron: "23 2 * * *"

permissions:
  contents: read

concurrency:
  group: docker-slurm-system
  cancel-in-progress: false

jobs:
  system:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Enable user namespaces for nested Apptainer
        run: |
          if [[ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - run: uv sync --locked
      - name: Build Docker Slurm image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: tests/system/docker_slurm
          load: true
          tags: rundra-slurm-system:ci
          cache-from: type=gha,scope=docker-slurm-system
          cache-to: type=gha,mode=max,scope=docker-slurm-system
      - name: Run Docker Slurm system tests
        run: tools/run_docker_slurm_system_tests.sh
        env:
          RUNDRA_DOCKER_SLURM_IMAGE: rundra-slurm-system:ci
          RUNDRA_DOCKER_SLURM_DIAGNOSTICS: ${{ runner.temp }}/docker-slurm-diagnostics
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docker-slurm-diagnostics
          path: ${{ runner.temp }}/docker-slurm-diagnostics
          if-no-files-found: warn
          retention-days: 14
