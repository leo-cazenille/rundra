name: docker-htcondor-system
on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 4"
permissions:
  contents: read
concurrency:
  group: docker-htcondor-system
  cancel-in-progress: false
jobs:
  system:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with: {enable-cache: true}
      - run: uv sync --locked
      - run: tools/run_docker_htcondor_system_tests.sh
