version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Europe/Paris
    open-pull-requests-limit: 2
    groups:
      actions:
        patterns:
          - "*"
    commit-message:
      prefix: build

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:30"
      timezone: Europe/Paris
    open-pull-requests-limit: 2
    groups:
      runtime:
        patterns:
          - pyyaml
          - tqdm
      typing:
        patterns:
          - mypy
          - types-pyyaml
      testing:
        patterns:
          - mcp
          - pytest
          - ruff
      release:
        patterns:
          - bandit
          - pip-audit
          - twine
          - uv-build
    commit-message:
      prefix: build
