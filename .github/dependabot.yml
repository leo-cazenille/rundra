version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      time: "04:00"
      timezone: Europe/Paris
    open-pull-requests-limit: 1
    groups:
      actions:
        patterns:
          - "*"
    commit-message:
      prefix: build

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: monthly
      time: "04:30"
      timezone: Europe/Paris
    open-pull-requests-limit: 1
    groups:
      python:
        patterns:
          - "*"
    commit-message:
      prefix: build
