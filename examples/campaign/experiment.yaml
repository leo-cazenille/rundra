version: 1

experiment:
  name: campaign-random-samples

command:
  argv:
    - python3
    - main.py
    - --config
    - "{config}"
    - --seed
    - "{seed}"
    - --output
    - /workspace/output/results/result-{seed}.json

resources:
  nodes: 1
  tasks: 1
  cpus_per_task: 1
  gpus_per_task: 0
  memory: 512MiB
  walltime: "00:05:00"

outputs:
  include: [results/**]
