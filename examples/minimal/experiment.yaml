version: 1

experiment:
  name: minimal

command:
  argv:
    - python
    - main.py
    - --config
    - "{config}"
    - --seed
    - "{seed}"

resources:
  nodes: 1
  tasks: 1
  cpus_per_task: 1
  gpus_per_task: 0
  memory: 1GiB
  walltime: "00:05:00"

outputs:
  include:
    - results/**

sync:
  exclude:
    - retrieved/
