version: 4
default_profile: shoal

defaults:
  config: ../config.json
  source_root: ..

profiles:
  local:
    target: local
    destination: ../retrieved/local-prepared
  shoal:
    target: shoal
    destination: ../retrieved/shoal-prepared
    workers: 2
    task_slots_per_worker: 10
  shoal-scale-long:
    target: shoal
    config: ../conf/scale-long.json
    destination: ../retrieved/shoal-scale-long
    workers: 8
    task_slots_per_worker: 10

preparation:
  source:
    working_tree: {}
  image:
    name: python-multiprocessing.sif
    definition:
      path: python.def
      context:
        include: []
      resources:
        cpus_per_task: 2
        memory: 2GiB
        walltime: "00:15:00"
