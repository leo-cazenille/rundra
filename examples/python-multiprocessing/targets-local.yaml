version: 8

targets:
  local:
    transport: {type: local}
    scheduler: {type: local}
    staging: {type: local}
    container: {type: apptainer}
    workspace: .rundra
    preparation:
      definition_build:
        allowed_locations: [local]
        mode: fakeroot
        max_resources:
          cpus_per_task: 4
          memory: 4GiB
          walltime: "00:30:00"
    execution:
      hard_task_limit: 10000
      confirmation_threshold: 1000
      max_active_tasks: 40
      max_concurrent_jobs: 16
      max_array_size: 1000
      output_shard_tasks: 1000
      automatic_retrieval_threshold: 1000
      max_memory_per_worker: 4GiB
      worker_pool:
        activation_threshold: 1000
        max_workers: 1
        default_workers: 1
        tasks_per_lease: 10
        default_task_slots_per_worker: 1
        max_task_slots_per_worker: 4
        infrastructure_retry_limit: 1
        requeue_limit: 2
