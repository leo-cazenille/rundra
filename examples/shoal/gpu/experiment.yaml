version: 1

experiment:
  name: shoal-gpu

command:
  argv:
    - /bin/sh
    - run.sh
    - --config
    - "{config}"
    - --seed
    - "{seed}"

container:
  image: /shoalhome/YOUR_USERNAME/path/to/gpu-image.sif
  gpu: true

resources:
  nodes: 1
  tasks: 1
  cpus_per_task: 1
  gpus_per_task: 1
  memory: 1GiB
  walltime: "00:05:00"

outputs:
  include:
    - results/**
