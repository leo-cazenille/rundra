version: 1

experiment:
  name: shoal-scaling

command:
  argv: [/bin/sh, run.sh, --config, "{config}", --seed, "{seed}"]

container:
  image: /absolute/path/to/cpu-image.sif
  gpu: false

resources:
  nodes: 1
  tasks: 1
  cpus_per_task: 1
  gpus_per_task: 0
  memory: 32MiB
  walltime: "00:02:00"

outputs:
  include: [results/**]
