version: 9
targets:
  condor:
    transport:
      type: ssh
      host: condor-access-point
    scheduler:
      type: htcondor
      shared_workspace: true
    staging:
      type: rsync
    container:
      type: apptainer
    workspace: /shared/rundra
    execution:
      hard_task_limit: 10000
      confirmation_threshold: 1000
      max_active_tasks: 100
      max_concurrent_jobs: 100
      max_array_size: 10000
      output_shard_tasks: 1000
      automatic_retrieval_threshold: 1000
      max_memory_per_worker: 4GiB
      worker_pool:
        activation_threshold: 10000
        max_workers: 100
        tasks_per_lease: 1
        infrastructure_retry_limit: 0
        requeue_limit: 0
        default_workers: 1
        default_task_slots_per_worker: 1
        max_task_slots_per_worker: 1
