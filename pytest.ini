[pytest]
addopts = --strict-markers -ra
testpaths = tests
markers =
    docker_slurm: opt-in Docker Compose SSH/Slurm/Apptainer system tests
    docker_pbs: opt-in Docker Compose SSH/OpenPBS/Apptainer system tests
    shoal_pogosim: opt-in live Pogosim array tests on the Shoal cluster
    shoal_system: opt-in tests that may access the real Shoal cluster
    shoal_cpu: resource-consuming Shoal tests requiring a separate CPU opt-in
    shoal_gpu: resource-consuming Shoal tests requiring a separate GPU opt-in
    shoal_failure: bounded Shoal M4.5 tests requiring a separate failure opt-in
    shoal_array: bounded Shoal M5.6 array test requiring a separate array opt-in
    shoal_lifecycle: bounded Shoal M6.6 async lifecycle test requiring a separate opt-in
    shoal_scaling: resource-consuming Shoal worker-scaling tests requiring a separate opt-in
    shoal_multiprocessing: two-node Shoal Python multiprocessing test requiring a separate opt-in
    shoal_prepared_submission: bounded cold/warm prepared submission test requiring a separate opt-in
