version: 1

experiment:
  name: docker-slurm-scratch-prepared

command:
  argv: [bin/model, --config, "{config}", --seed, "{seed}"]

container:
  image: scratch-prepared.sif
  gpu: false

resources:
  nodes: 1
  tasks: 1
  cpus_per_task: 1
  gpus_per_task: 0
  memory: 32MiB
  walltime: "00:02:00"

outputs:
  include: [results/**]
