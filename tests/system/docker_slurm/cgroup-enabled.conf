# This configuration is exclusively for the privileged Docker system test.
# IgnoreSystemd is supported by Slurm for development/testing environments;
# production deployments should use systemd delegation instead.
CgroupPlugin=cgroup/v2
IgnoreSystemd=yes
EnableControllers=yes
ConstrainRAMSpace=yes
ConstrainSwapSpace=yes
AllowedRAMSpace=100
AllowedSwapSpace=0
