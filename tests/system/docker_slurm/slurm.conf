ClusterName=rundra-system
SlurmctldHost=controller
AuthType=auth/munge
CryptoType=crypto/munge
MpiDefault=none
ProctrackType=proctrack/linuxproc
ReturnToService=2
SlurmctldPidFile=/run/slurmctld.pid
SlurmctldPort=6817
SlurmdPidFile=/run/slurmd.pid
SlurmdPort=6818
SlurmdSpoolDir=/var/spool/slurmd
StateSaveLocation=/var/spool/slurmctld
SwitchType=switch/none
TaskPlugin=task/none
TaskProlog=/opt/rundra-cluster/task-prolog.sh
SelectType=select/cons_tres
SelectTypeParameters=CR_Core_Memory
SchedulerType=sched/backfill
JobAcctGatherType=jobacct_gather/none
SlurmdParameters=config_overrides
MinJobAge=600
SlurmctldTimeout=120
SlurmdTimeout=120
NodeName=compute[1-2] CPUs=2 RealMemory=1800 State=UNKNOWN
PartitionName=cpu-short Nodes=ALL Default=YES MaxTime=01:00:00 State=UP
PartitionName=cpu-long Nodes=ALL MaxTime=12:00:00 State=UP
PartitionName=gpu-short Nodes=ALL MaxTime=01:00:00 State=UP
