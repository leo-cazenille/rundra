version: 1
experiment:
  name: docker-htcondor
command:
  argv: [/bin/sh, -c, 'hostname > /workspace/output/hostname.txt; printf "%s\n" "$1" > /workspace/output/seed.txt', rundra-htcondor, '{seed}', '{config}']
container: {image: /workspace/test.sif, gpu: false}
resources:
  nodes: 1
  tasks: 1
  cpus_per_task: 1
  gpus_per_task: 0
  memory: 64MiB
  walltime: "00:02:00"
outputs:
  include: [hostname.txt, seed.txt]
